<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cockpit – Von Strategie zu funktionierender Organisation</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--brand:#386784;--leaf:#95C11F;--sage:#82B0A9;--light:#EEF4F2;--red:#D9534F;--orange:#E8892B;--grey:#B8B8B8;--text:#25384a;}
*{box-sizing:border-box}
body{margin:0;font-family:"Nunito",ui-sans-serif,system-ui,Arial,sans-serif;color:#2f2f2f;background:#fbfdfc;font-size:14.5px}
header{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 24px;border-bottom:1px solid #e0ebe8;background:#fff;flex-wrap:wrap}
.hr{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
#back button{border:0;background:transparent;color:var(--brand);font:inherit;font-weight:800;padding:7px 14px;border-radius:99px;cursor:pointer;font-size:14px}#back button:hover{background:var(--light)}
.logo{font-weight:800;font-size:21px;color:var(--brand);text-transform:uppercase}.logo span{color:var(--leaf);text-transform:none}
.sub{color:#6b7c88;font-size:12px}
.badge{padding:3px 10px;border-radius:99px;font-size:12px;font-weight:700;color:#fff}
.b-red{background:var(--red)}.b-or{background:var(--orange)}.b-gr{background:#6ea015}.b-live{background:#6ea015}.b-loc{background:var(--orange)}
.spacer{flex:1}
nav{display:flex;gap:4px;padding:8px 20px;background:var(--light);border-bottom:1px solid #dde6e3;flex-wrap:wrap}
nav button{border:0;background:transparent;padding:8px 14px;border-radius:99px;font-weight:700;color:var(--brand);cursor:pointer;font-size:13px}
nav button.on{background:var(--brand);color:#fff}
main{padding:28px 24px 48px;max-width:1280px;margin:0 auto}
h1.pt{font-size:30px;font-weight:800;color:var(--brand);margin:0 0 14px}
h1.big{font-size:40px;line-height:1.15;font-weight:800;color:var(--brand);margin:6px 0 4px;max-width:820px}
.ph{border:1px solid #e0ebe8;border-radius:18px;background:#fff;padding:18px;height:100%}
.ph.on{border-color:var(--leaf);box-shadow:0 4px 14px rgba(0,0,0,.08);cursor:pointer;transition:.15s}.ph.on:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(0,0,0,.12)}.ph.off{opacity:.5}
.ph small{font-weight:800;letter-spacing:.2em;color:var(--leaf);font-size:11px}.ph h3{margin:4px 0;font-size:21px;font-weight:800;color:var(--brand);text-transform:none;letter-spacing:0}.ph p{margin:6px 0 0;color:#6b7c88}
.phases{display:grid;grid-template-columns:1fr auto 1fr auto 1fr auto 1fr auto 1fr;gap:10px;align-items:stretch;margin-top:18px}.phases .ar{align-self:center;color:var(--leaf);font-size:22px;font-weight:800}
@media(max-width:900px){.phases{grid-template-columns:1fr}.phases .ar{display:none}}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:30px}
.tile{display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-start;border-radius:18px;background:var(--light);padding:22px;cursor:pointer;transition:.15s;border:0;text-align:left;font:inherit;color:inherit;width:100%}.tile:hover{box-shadow:0 6px 18px rgba(0,0,0,.1);transform:translateY(-1px)}
.tile h3{margin:0 0 4px;font-size:20px;font-weight:800;color:var(--brand);text-transform:none;letter-spacing:0}.tile p{margin:0;color:#6b7c88;font-size:13.5px}
.tile .st{display:inline-block;margin-top:10px;padding:2px 10px;border-radius:99px;background:#fff;color:var(--brand);font-weight:800;font-size:12px}.tile .st.red{background:var(--red);color:#fff}.tile .st.gr{background:#6ea015;color:#fff}
button.btn{background:var(--brand);color:#fff;border:0;padding:8px 16px;border-radius:99px;font-weight:800;cursor:pointer;font-size:13px;font-family:inherit}
button.btn.ghost{background:#fff;color:var(--brand);border:1px solid var(--brand)}
button.btn.leaf{background:var(--leaf);color:#1c2b00}
button.btn.red{background:var(--red)}
button.btn:disabled{opacity:.5}
.bar{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
input[type=text],input:not([type]),select,textarea{font:inherit;border:1px solid #cfdcd8;border-radius:10px;padding:6px 8px;background:#fff;color:var(--text);width:100%}
textarea{min-height:56px;resize:vertical}
.status{padding:14px 18px;border-radius:16px;font-weight:800;font-size:17px;color:#fff;margin-bottom:16px}
.status.red{background:var(--red)}.status.green{background:#6ea015}
table{border-collapse:collapse;width:100%}
th{background:var(--brand);color:#fff;text-align:left;padding:9px 10px;font-size:12px}table{border-radius:12px;overflow:hidden}
td{padding:7px 8px;border-bottom:1px solid #e6eeeb;vertical-align:top}
tr.link{cursor:pointer}tr.link:hover{background:var(--light)}
.pbar{height:8px;background:#e6eeeb;border-radius:99px;overflow:hidden;min-width:90px}.pbar div{height:100%;background:var(--leaf)}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;vertical-align:middle}
.dot.red{background:var(--red)}.dot.orange{background:var(--orange)}.dot.green{background:var(--leaf)}
.chip{display:inline-block;background:#fbe3e2;color:#a12622;border-radius:99px;padding:1px 8px;font-size:11px;margin:1px 2px 1px 0}
#mapwrap{position:relative;overflow:auto;border:1px solid #e0ebe8;border-radius:18px;height:calc(100vh - 210px);min-height:420px;background:#fff}
#map{position:relative}
#map svg{position:absolute;left:0;top:0;pointer-events:none}
.node{position:absolute;width:226px;height:36px;border-radius:12px;font-family:inherit;border:2.5px solid var(--grey);background:#fff;padding:7px 8px;display:flex;align-items:center;gap:6px;cursor:pointer;font-size:12.5px;font-weight:700;color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.node.red{border-color:var(--red)}.node.orange{border-color:var(--orange)}.node.green{border-color:var(--leaf)}
.node.sel{box-shadow:0 0 0 3px rgba(56,103,132,.35)}
.node.company,.node.area{background:var(--brand);color:#fff;border-color:var(--brand)}
.node.area.red{border-color:var(--red);box-shadow:0 0 0 2px var(--red)}
.node .t{flex:1;min-width:0;white-space:normal;overflow-wrap:break-word;hyphens:auto;line-height:1.2}.node::before{content:"";position:absolute;left:10px;right:10px;top:-2.5px;height:4px;border-radius:3px;background:var(--lc,#95C11F)}.node.company{--lc:#25384a}.node.area{--lc:#386784}.node.main{--lc:#82B0A9}.node.sub{--lc:#95C11F}.node.step{--lc:#E3B505}
.lg{display:inline-flex;gap:4px;align-items:center;font-size:12px;color:#4a5b68;margin:0 6px}.lg i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-left:8px}
.node .ask{display:block;color:var(--red);font-weight:800;font-size:11px;margin-top:2px;opacity:1;text-transform:none;letter-spacing:0}.askbox textarea{color:var(--red);font-weight:700;border-color:#f0b9b7;background:#fff7f6;min-height:60px}.node .lv{display:block;line-height:1.1;font-size:8.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;opacity:.65}.node.step{border-left-width:6px}#mapwrap{cursor:grab}.node{cursor:move}.node.dt{outline:3px dashed var(--leaf);outline-offset:2px}#mapwrap.pan{cursor:grabbing;user-select:none}
.node .c{font-size:10.5px;font-weight:700;color:#6b7c88;white-space:nowrap}
.node.company .c,.node.area .c{color:#d6e5ee}
.node .tg{width:18px;height:18px;border-radius:50%;background:var(--light);color:var(--brand);text-align:center;line-height:18px;font-size:11px;flex:none}
.node .rd{width:8px;height:8px;border-radius:50%;background:var(--red);flex:none}
#panel{position:fixed;right:0;top:0;bottom:0;width:480px;max-width:100%;background:#fff;border-left:1px solid #c5d3cf;box-shadow:-6px 0 18px rgba(0,0,0,.1);transform:translateX(105%);transition:transform .2s;overflow:auto;padding:16px;z-index:20}
#panel.open{transform:none}
#panel h3,h3{margin:14px 0 6px;color:var(--brand);font-size:13px;text-transform:uppercase;letter-spacing:.06em}
.q{margin-bottom:10px}.q label{display:block;font-weight:700;font-size:12.5px;margin-bottom:3px}
.q.req.empty label{color:var(--red)}.q.req.empty textarea{border-color:var(--red);background:#fff6f5}
.req-tag{font-size:10px;color:#6b7c88;font-weight:400}
.row{display:flex;gap:6px;margin-bottom:6px;align-items:center}
.row>*{flex:1}.row>.sm{flex:none;width:auto}
.crumb{font-size:12px;color:#6b7c88;margin-bottom:6px}
.note{background:#fff8e6;border:1px solid #f1deaa;border-radius:8px;padding:8px;font-size:12.5px}
.ck{display:flex;gap:6px;align-items:flex-start;margin-bottom:3px;font-size:12.5px}.ck input{width:auto;margin-top:3px}
.ck.done span{text-decoration:line-through;color:#8a9aa5}
.x{cursor:pointer;color:var(--red);font-weight:700;flex:none;width:auto}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#25384a;color:#fff;padding:10px 16px;border-radius:8px;display:none;z-index:50;max-width:80%}
.card{border:1px solid #e0ebe8;border-radius:16px;padding:16px;margin-bottom:14px;background:#fff}
.muted{color:#6b7c88}
.sug{background:#fffbe6;border:1px solid #efd67a;border-radius:8px;padding:8px;margin:4px 0 6px;font-size:12.5px}
.pcard{border:1px solid #e0ebe8;border-radius:16px;background:#fff;margin:16px 0;overflow:hidden}
.phead{background:#2f5f7e;color:#fff;display:flex;align-items:center;gap:10px;padding:9px 16px;cursor:pointer;font-size:13px}
.phead input{width:auto;padding:3px 8px;font-size:12px;border-radius:6px;border:1px solid #5d86a0;background:#2f5f7e;color:#fff}
.pdel{font-size:12px;opacity:.85}.pdel:hover{opacity:1;text-decoration:underline}
.pbody{display:grid;grid-template-columns:minmax(260px,1fr) 2fr;gap:14px;padding:14px}
@media(max-width:900px){.pbody{grid-template-columns:1fr}}
.pleft{background:var(--light);border-radius:12px;padding:12px}.plh{font-size:11px;font-weight:800;letter-spacing:.1em;color:var(--brand);margin-bottom:8px}
.padd{margin-top:8px;font-size:12px}
.ptag{background:#fff;border-radius:99px;padding:1px 7px;color:#6b7c88;margin-left:4px;font-size:10.5px}
.pcar{cursor:pointer;color:#9fb6c4;font-weight:800;flex:none}.pcar.on{color:var(--brand)}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pn{border:1px solid #e0ebe8;border-left:4px solid var(--leaf);border-radius:12px;padding:8px 10px;background:#fff}
.pnh{font-size:11px;font-weight:800;letter-spacing:.08em;color:var(--brand);margin-bottom:4px}
.pn textarea{border:0;padding:0;min-height:96px;font-size:12.5px;outline:none;border-radius:0}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;margin:18px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px;margin:12px 0}
details{border:1px solid #e0ebe8;background:#fff;border-radius:14px;padding:8px 12px;margin:10px 0;max-width:980px}
summary{cursor:pointer;font-weight:800;color:var(--brand)}
details table{margin:8px 0}
button.btn.sm{padding:6px 10px}
</style>
</head>

<script>
"use strict";
const CFG = window.COCKPIT_CONFIG || {};
const LIVE = !!(CFG.SUPABASE_URL && CFG.SUPABASE_ANON_KEY);
const CLIENT = Math.random().toString(36).slice(2);
const LV = {company:"Unternehmen",area:"Bereich",main:"Hauptprozess",sub:"Teilprozess",step:"Schritt"};
const CHILD = {company:"area",area:"main",main:"sub",sub:"step",step:null};
const STATUS = [["open","Offen"],["taken","Aufgenommen"],["mirrored","Rückgespiegelt"],["confirmed","Bestätigt"]];
const QS = {
 q1:["Auslöser","Was löst es aus?"],
 q2:["Ergebnis","Was soll am Ende herauskommen, was wird übergeben?"],
 q4:["Beteiligte","Wer ist beteiligt?"],
 q5:["Unterlagen","Welche Informationen und Dokumente braucht es?"],
 q6:["Wo hakt es","Wo hakt es heute? (Nur aufschreiben, noch nicht optimieren. Wenn nichts: „kein Engpass“)"],
 q7:["Wer macht / gibt frei","Wer macht es, wer gibt frei?"],
 q8:["Ablageort","Wo werden Informationen und Dokumente abgelegt?"],
 q9:["Abhängigkeiten und Fristen","Welche Abhängigkeiten und Fristen gibt es? (Wenn keine: „keine“)"],
 q10:["Ausnahmen","Welche Ausnahmen gibt es? Was passiert, wenn etwas fehlt?"],
 q11:["Häufigkeit und Dauer","Wie oft kommt es vor, wie lange dauert es?"],
 q12:["Rückfragen","Welche Rückfragen kommen immer wieder?"]};
const REQ = {main:["q1","q2","q4","q5","q6"],sub:["q1","q2","q4","q5","q6"],step:["q7","q5","q6","q9","q11"]};
const OPT = {main:["q7","q8","q9","q10","q11","q12"],sub:["q7","q8","q9","q10","q11","q12"],step:["q1","q2","q4","q8","q10","q12"]};
const COUNTS = n => n.level==="main"||n.level==="sub"||n.level==="step";

let extra = {}; // Protokolle, Ideen, Meta (liegen in derselben Tabelle, Feld kind)
let nodes = {}, sel = null, tab = "home", onlyGaps = false, search = "", collapsed = new Set(), sb = null;
const $ = s => document.querySelector(s);
const esc = s => String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const uid = () => "n"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
function toast(t){const e=$("#toast");e.textContent=t;e.style.display="block";clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display="none",3500)}

const kids = id => Object.values(nodes).filter(n=>n.parent===id).sort((a,b)=>a.ord-b.ord);
const SEED_VERSION = 4;
function norm(n){n.q=n.q||{};n.checklist=n.checklist||[];n.deps=n.deps||[];n.fristen=n.fristen||[];n.status=n.status||"open";n.sug=n.sug||{};n.qc=n.qc||[];return n}
function path(id){const o=[];let c=nodes[id];while(c){o.unshift(c);c=c.parent?nodes[c.parent]:null}return o}
function pathStr(id){return path(id).filter(n=>n.parent).map(n=>n.name).join(" › ")}
function areaOf(id){const p=path(id);return p[1]?p[1].name:""}
function filled(n,k){
  if(k==="q9"&&((n.deps||[]).length||(n.fristen||[]).length)) return true;
  return !!(n.q[k]||"").trim();
}
function missing(n){return (REQ[n.level]||[]).filter(k=>!filled(n,k))}
function ownState(n){ if(missing(n).length) return "red"; return n.status==="confirmed"?"green":"orange"; }
function computeGaps(){
  const out={};
  const visit=id=>{
    const n=nodes[id];let done=0,total=0;const st=[];
    if(COUNTS(n)) st.push(ownState(n));
    for(const k of kids(id)){
      const g=visit(k.id);done+=g.done+(COUNTS(k)&&ownState(k)==="green"?1:0);total+=g.total+(COUNTS(k)?1:0);st.push(g.state);
    }
    if(n.level==="area"&&!kids(id).length) st.push("red");
    const state=st.includes("red")?"red":st.includes("orange")?"orange":"green";
    return out[id]={state,done,total};
  };
  const r=Object.values(nodes).find(n=>!n.parent); if(r) visit(r.id);
  return out;
}
let GAPS={};

let localTimer=null; const pend=new Map();
function persistLocal(){clearTimeout(localTimer);localTimer=setTimeout(()=>localStorage.setItem("cockpit-ist-v2",JSON.stringify({nodes,extra})),300)}
function saveExtra(e){e.upd=Date.now();e.by=CLIENT;extra[e.id]=e;save(e,true)}
async function removeExtra(id){delete extra[id];if(!LIVE){persistLocal();return}const r=await sb.from("nodes").delete().eq("id",id);if(r.error)toast("Löschen fehlgeschlagen: "+r.error.message)}
function put(d){if(d.kind)extra[d.id]=d;else nodes[d.id]=norm(d)}
function save(n,isExtra){
  n.upd=Date.now();n.by=CLIENT;
  if(!LIVE){persistLocal();return}
  clearTimeout(pend.get(n.id));
  pend.set(n.id,setTimeout(async()=>{
    const r=await sb.from("nodes").upsert({id:n.id,data:n,updated_at:new Date().toISOString()});
    if(r.error) toast("Speichern fehlgeschlagen: "+r.error.message);
  },500));
}
async function removeIds(ids){
  ids.forEach(i=>delete nodes[i]);
  ids.forEach(i=>delete extra[i]);
  if(!LIVE){persistLocal();return}
  const r=await sb.from("nodes").delete().in("id",ids); if(r.error) toast("Löschen fehlgeschlagen: "+r.error.message);
}
async function saveMany(list){
  list.forEach(n=>{n.upd=Date.now();n.by=CLIENT;if(n.kind)extra[n.id]=n;else nodes[n.id]=n});
  if(!LIVE){persistLocal();return}
  for(let i=0;i<list.length;i+=100){
    const r=await sb.from("nodes").upsert(list.slice(i,i+100).map(n=>({id:n.id,data:n,updated_at:new Date().toISOString()})));
    if(r.error){toast("Speichern fehlgeschlagen: "+r.error.message);return}
  }
}
function loadScript(src){return new Promise((ok,no)=>{const s=document.createElement("script");s.src=src;s.onload=ok;s.onerror=()=>no(new Error("Konnte "+src+" nicht laden"));document.head.appendChild(s)})}
function collapseDefault(){Object.values(nodes).forEach(n=>{if((n.level==="main"||n.level==="sub")&&kids(n.id).length) collapsed.add(n.id)})}
async function init(){
  $("#mode").textContent=LIVE?"Gemeinsamer Live-Stand":"Lokaler Modus (nur dieser Browser)";
  $("#mode").className="badge "+(LIVE?"b-live":"b-loc");
  try{
    if(LIVE){
      await loadScript("https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2");
      sb=window.supabase.createClient(CFG.SUPABASE_URL,CFG.SUPABASE_ANON_KEY);
      const r=await sb.from("nodes").select("id,data");
      if(r.error) throw r.error;
      r.data.forEach(x=>put(x.data));
      sb.channel("nodes-live").on("postgres_changes",{event:"*",schema:"public",table:"nodes"},p=>{
        if(p.eventType==="DELETE"){delete nodes[p.old.id];delete extra[p.old.id]}
        else{const d=p.new.data;if(d&&d.by===CLIENT)return;put(d)}
        refresh(true);
      }).subscribe();
    }else{
      const raw=localStorage.getItem("cockpit-ist-v2");
      if(raw){const o=JSON.parse(raw);Object.values(o.nodes||{}).forEach(n=>nodes[n.id]=norm(n));extra=o.extra||{}}
      else{const old=localStorage.getItem("cockpit-ist-v1");if(old)Object.values(JSON.parse(old)).forEach(n=>nodes[n.id]=norm(n))}
    }
  }catch(e){toast("Verbindung fehlgeschlagen: "+(e.message||e));}
  if(!extra.META||extra.META.seed<SEED_VERSION){ await loadSeed(true); }
  collapseDefault();
  refresh();
}
/* Startdaten zusammenführen: ergänzt fehlende Kacheln und Vorschläge, überschreibt nie eingetragene Antworten. */
async function loadSeed(silent){
  const changed=[];let added=0;
  for(const s of SEED.nodes){
    const ex=nodes[s.id];
    if(!ex){const n=norm(JSON.parse(JSON.stringify(s)));changed.push(n);added++;continue}
    let ch=false;
    if(ex.ord!==s.ord){ex.ord=s.ord;ch=true}
    if(ex.parent!==s.parent){ex.parent=s.parent;ch=true}
    if(s.sug&&JSON.stringify(ex.sug)!==JSON.stringify(s.sug)){ex.sug=s.sug;ex.sugsrc=s.sugsrc;ch=true}
    if(s.note&&!ex.note){ex.note=s.note;ch=true}
    if((s.checklist||[]).length&&!(ex.checklist||[]).length){ex.checklist=s.checklist;ch=true}
    for(const k in (s.q||{})) if(!(ex.q[k]||"").trim()){ex.q[k]=s.q[k];ch=true}
    if(ch)changed.push(ex);
  }
  await saveMany(changed);
  const ex2=[];
  for(const p of SEED.protocols){
    if(!extra[p.id]){extra[p.id]=JSON.parse(JSON.stringify(p));ex2.push(extra[p.id])}
    else if(p.kind==="protocol"){let ch=false;p.tasks.forEach((t,i)=>{const e=extra[p.id].tasks[i];if(e&&e.t===t.t){if(t.from&&!e.from){e.from=t.from;ch=true}if(t.src&&!e.src){e.src=t.src;ch=true}}});if(ch)ex2.push(extra[p.id])}
  }
  extra.META={id:"META",kind:"meta",seed:SEED_VERSION};ex2.push(extra.META);
  await saveMany(ex2);
  if(!silent) toast(added+" neue Kacheln, "+changed.length+" aktualisiert");
  collapseDefault();
  refresh();
}

function refresh(fromRemote){
  GAPS=computeGaps();
  const root=Object.values(nodes).find(n=>!n.parent), g=root?GAPS[root.id]:null;
  $("#nodelist").innerHTML=Object.values(nodes).filter(COUNTS).map(n=>`<option value="${esc(pathStr(n.id))}">`).join("");
  renderTabs();renderPage();
  if(sel&&nodes[sel]){ if(!fromRemote||!$("#panel").contains(document.activeElement)) renderPanel(); } else if(sel){sel=null;$("#panel").classList.remove("open")}
}
function renderTabs(){
  $("#back").innerHTML=tab==="home"?"":'<button data-tab="home">← Zum Cockpit</button>';
}
const TITLES={fahrplan:"Fahrplan",ist:"Ist-Stand auf einen Blick",gaps:"Lücken",eng:"Engpässe",dep:"Abhängigkeiten und Fristen",prot:"Wöchentlicher Austausch",idea:"Ideenliste",soll:"Weg zum Soll",data:"Daten"};

  const v=$("#view");
  if(tab==="home") return renderHome(v);
  if(tab==="start") return renderStart(v);
  if(tab==="fahrplan") return renderFahrplan(v);
  if(tab==="prot") return renderProt(v);
  if(tab==="idea") return renderIdea(v);
  if(tab==="soll") return renderSoll(v);
  if(tab==="map") return renderMap(v);
  if(tab==="ist") return renderIst(v);
  if(tab==="gaps") return renderGaps(v);
  if(tab==="eng") return renderEng(v);
  if(tab==="dep") return renderDep(v);
  return renderData(v);
}
function renderPage(){renderView();const v=$("#view");if(TITLES[tab])v.insertAdjacentHTML("afterbegin",`<h1 class="pt">${TITLES[tab]}</h1>`)}
const dotc = s => `<span class="dot ${s}"></span>`;

let mapMode="t",mapZoom=0.9;try{mapMode=localStorage.getItem("cockpit-mapmode2")||"t"}catch(e){}
const MODES={t:"Organigramm",v:"Liste",h:"waagerecht"};
const LVN={company:"Unternehmen",area:"Bereich",main:"Hauptprozess",sub:"Teilprozess",step:"Schritt"};
function renderMap(v){
  const old=$("#mapwrap");const scroll=old?[old.scrollLeft,old.scrollTop]:[0,0];
  v.innerHTML=`<div class="bar">
    <button class="btn ghost" data-act="mapmode">Ansicht: ${MODES[mapMode]}</button>
    <button class="btn ghost sm" data-act="zout" title="Verkleinern">−</button><button class="btn ghost sm" data-act="zin" title="Vergrößern">+</button><button class="btn ghost sm" data-act="zfit">Einpassen</button>
    <button class="btn ghost" data-act="expand">Alles aufklappen</button>
    <button class="btn ghost" data-act="collapse">Alles zuklappen</button>
    <button class="btn ${onlyGaps?"red":"ghost"}" data-act="gaps">Nur Lücken anzeigen</button>
    <input id="q" placeholder="Suchen …" value="${esc(search)}" style="max-width:240px">
    <span class="lg"><i style="background:#25384a"></i>Unternehmen <i style="background:#386784"></i>Bereich <i style="background:#82B0A9"></i>Hauptprozess <i style="background:#95C11F"></i>Teilprozess <i style="background:#E3B505"></i>Schritt</span>
    <span class="muted">Kachel ziehen = verschieben (auch auf andere Ebene) · Hintergrund ziehen = verschieben · Klick = öffnen · Doppelklick = auf-/zuklappen · Rahmen: <span class="dot red"></span> Lücke <span class="dot orange"></span> ausgefüllt, nicht bestätigt <span class="dot green"></span> vollständig</span>
  </div><div id="mapwrap"><div id="map"></div></div>`;
  const q=search.trim().toLowerCase();
  const match=id=>{const n=nodes[id];if(n.name.toLowerCase().includes(q))return true;return kids(id).some(k=>match(k.id))};
  const V=mapMode==="v",T=mapMode==="t";
  let ctx=null;try{ctx=document.createElement("canvas").getContext("2d")}catch(e){}
  const nlines=(txt,w,font)=>{if(ctx)ctx.font=font;const mw=t=>ctx?ctx.measureText(t).width:t.length*6.8;let c=0;String(txt).split("\n").forEach(para=>{let cur="",k=1;para.split(/\s+/).forEach(word=>{const t=cur?cur+" "+word:word;if(mw(t)>w&&cur){k++;cur=word}else cur=t});c+=k});return c};
  const pos={};const order=[];let cur=12;
  const inner=id=>{const n=nodes[id],g=GAPS[id],hasK=kids(id).length>0;const cnt=hasK&&g.total?`${g.done}/${g.total}`:"";
    return `${COUNTS(n)&&ownState(n)==="red"?'<span class="rd"></span>':""}<span class="t"><small class="lv">${LVN[n.level]||""}</small>${esc(n.name)}${n.ask?`<small class="ask">❓ ${esc(n.ask)}</small>`:""}</span><span class="c">${cnt}</span>${hasK?`<span class="tg" data-tg="${id}">${(q||!collapsed.has(id))?"–":"+"}</span>`:""}`};
  const ms=document.createElement("div");ms.style.cssText="position:absolute;left:-9999px;top:0;visibility:hidden";document.body.appendChild(ms);
  const dims=(id,d)=>{const w=T?240:(V?640-d*34:280);const e=document.createElement("div");e.className="node "+nodes[id].level;e.style.cssText="position:relative;left:0;top:0;width:"+w+"px;height:auto";e.innerHTML=inner(id);ms.appendChild(e);
    return {w,h:Math.max(42,Math.ceil(e.getBoundingClientRect().height))+2}};
  const walk=(id,d)=>{
    let ks=kids(id);
    if(onlyGaps) ks=ks.filter(k=>GAPS[k.id].state!=="green");
    if(q) ks=ks.filter(k=>match(k.id));
    const open=ks.length&&(q||!collapsed.has(id));
    const m=dims(id,d);const x=V?d*34+12:d*316+12;
    if(V){pos[id]={x,y:cur,...m};cur+=m.h+8;if(open)ks.forEach(k=>walk(k.id,d+1));return}
    if(!open){pos[id]={x,y:cur,...m};cur+=m.h+10;return}
    const start=cur;ks.forEach(k=>walk(k.id,d+1));
    const f=pos[ks[0].id],l=pos[ks[ks.length-1].id];
    const y=Math.max(start,(f.y+f.h/2+l.y+l.h/2)/2-m.h/2);pos[id]={x,y,...m};cur=Math.max(cur,y+m.h+10);
  };
  const root=Object.values(nodes).find(n=>!n.parent); if(!root){$("#map").textContent="Keine Daten.";return}
  if(T){
    const vis=id=>{let ks=kids(id);if(onlyGaps)ks=ks.filter(k=>GAPS[k.id].state!=="green");if(q)ks=ks.filter(k=>match(k.id));return ks.length&&(q||!collapsed.has(id))?ks:[]};
    const info={},maxH=[];

const LORD=["company","area","main","sub","step"];
function descIds(id){const r=[];const w=i=>kids(i).forEach(k=>{r.push(k.id);w(k.id)});w(id);return r}
function mvOpts(lv,id){const pl=LORD[LORD.indexOf(lv)-1];const bad=new Set([id,...descIds(id)]);const cur=nodes[id].parent;
  return Object.values(nodes).filter(x=>x.level===pl&&!bad.has(x.id)).sort((a,b)=>pathStr(a.id).localeCompare(pathStr(b.id))).map(x=>`<option value="${x.id}" ${x.id===cur?"selected":""}>${esc(x.parent?pathStr(x.id):x.name)}</option>`).join("")}
function moveTo(d,pid,idx,lv){const delta=LORD.indexOf(lv)-LORD.indexOf(d.level),ds=descIds(d.id);
  if(LORD.indexOf(lv)<1||ds.some(i=>{const k=LORD.indexOf(nodes[i].level)+delta;return k>4||k<2}))return false;
  d.level=lv;d.parent=pid;ds.forEach(i=>{nodes[i].level=LORD[LORD.indexOf(nodes[i].level)+delta]});
  const list=kids(pid).filter(x=>x.id!==d.id);if(idx==null||idx>list.length)idx=list.length;list.splice(idx,0,d);list.forEach((x,k)=>{x.ord=k});
  [...list,...ds.map(i=>nodes[i])].forEach(x=>save(x));return true}
function select(id,focus){
  sel=id;
  if(focus){let c=nodes[id];while(c&&c.parent){c=nodes[c.parent];collapsed.delete(c.id)}tab="map";search="";onlyGaps=false}
  refresh();
  if(focus){const e=document.querySelector(`.node[data-id="${id}"]`);if(e)e.scrollIntoView({block:"center",inline:"center"})}
}
function downloadFile(name,text,type){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click()}
const csvEsc=v=>'"'+String(v==null?"":v).replace(/"/g,'""')+'"';
function toCsv(head,rows){return "﻿"+[head,...rows].map(r=>r.map(csvEsc).join(";")).join("\n")}
function exportCsv(){
  const head=["ID","Eltern-ID","Ebene","Bereich","Pfad","Name","Q1 Auslöser","Q2 Ergebnis","Q3 Schritte (Unterkacheln)","Q4 Beteiligte","Q5 Unterlagen","Q6 Wo hakt es","Q7 Wer macht / gibt frei","Q8 Ablageort","Q9 Abhängigkeiten und Fristen","Q10 Ausnahmen","Q11 Häufigkeit und Dauer","Q12 Rückfragen","Notiz aus Excel","Checkliste","Wartet auf (IDs)","Wartet auf (Text)","Fristen","Häufigkeit","Auswirkung","Score","Status","Ampel","Gesprächsquelle","Soll-Änderung","Automatisierbar","Pilotprozess"];
  const order=[];const walk=id=>{order.push(nodes[id]);kids(id).forEach(k=>walk(k.id))};
  const r=Object.values(nodes).find(n=>!n.parent);if(r)walk(r.id);
  const rows=order.filter(n=>n.parent).map(n=>[n.id,n.parent,LV[n.level],areaOf(n.id),pathStr(n.id),n.name,
    n.q.q1,n.q.q2,kids(n.id).map(k=>k.name).join(" | "),n.q.q4,n.q.q5,n.q.q6,n.q.q7,n.q.q8,n.q.q9,n.q.q10,n.q.q11,n.q.q12,n.note,
    n.checklist.map(c=>c.t+(c.n?" → "+c.n:"")).join(" | "),n.deps.filter(d=>d.ref).map(d=>d.ref).join(" | "),n.deps.filter(d=>!d.ref).map(d=>d.text).join(" | "),
    n.fristen.map(f=>f.art+": "+f.name+" "+f.dauer).join(" | "),n.h||"",n.a||"",n.h&&n.a?n.h*n.a:"",(STATUS.find(s=>s[0]===n.status)||[])[1],COUNTS(n)?ownState(n):"",n.src||"",n.soll||"",n.auto||"",n.pilot?"ja":""]);
  downloadFile("cockpit-ist-aufnahme.csv",toCsv(head,rows),"text/csv");
}
async function importXlsx(file){
  try{
    if(!window.XLSX) await loadScript("https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js");
    const wb=XLSX.read(await file.arrayBuffer(),{type:"array"});
    const pick=e=>{const nm=wb.SheetNames.find(s=>s.trim().endsWith(e));if(!nm)throw new Error("Arbeitsblatt „… "+e+"“ fehlt.");return XLSX.utils.sheet_to_json(wb.Sheets[nm],{header:1,defval:"",range:0})};
    const S=pick("Ist_Struktur"),C=pick("Ist_Checklisten");
    const head=S[3].map(x=>String(x).replace(/\s+/g," ").trim());
    const col=nm=>{const i=head.indexOf(nm);if(i<0)throw new Error("Spalte fehlt in Zeile 4: „"+nm+"“");return i};
    const iID=col("ID"),iP=col("Eltern-ID"),iL=col("Ebene"),iN=col("Name (Hauptprozess / Teilprozess / Schritt)"),iW=col("Verantwortlich"),iH=col("Hinweis aus Excel"),iS=col("Quelle");
    const map={};const newNodes=[];const areaByName=n=>Object.values(nodes).find(x=>x.level==="area"&&x.name===n);
    const cnt={};
    for(const r of S.slice(4)){
      const id=String(r[iID]).trim(),lv=String(r[iL]).trim();if(!id||!lv)continue;
      if(lv==="Bereich"){const a=areaByName(String(r[iN]).trim());if(a)map[id]=a.id;continue}
      const level={Hauptprozess:"main",Teilprozess:"sub",Schritt:"step"}[lv];if(!level)continue;
      const par=map[String(r[iP]).trim()];if(!par)continue;
      const nid=uid();map[id]=nid;if(cnt[par]===undefined)cnt[par]=kids(par).length;
      const w=String(r[iW]).trim();
      newNodes.push(norm({id:nid,parent:par,level,name:String(r[iN]).trim(),ord:cnt[par]++,source:String(r[iS]||""),note:String(r[iH]||"").trim(),q:w?{[level==="step"?"q7":"q4"]:w}:{}}));
    }
    const byId=Object.fromEntries(newNodes.map(n=>[n.id,n]));
    const ch=C[3].map(x=>String(x).trim());
    for(const r of C.slice(4)){
      if(String(r[0]).startsWith("Zusatz"))break;
      const t=byId[map[String(r[ch.indexOf("Kachel-ID")]).trim()]];const txt=String(r[ch.indexOf("Prüfpunkt")]||"").trim();
      if(t&&txt)t.checklist.push({t:txt,n:String(r[ch.indexOf("Hinweis aus Excel")]||"").trim(),d:false});
    }
    if(!newNodes.length)throw new Error("Keine Kacheln gefunden (Bereichsname muss einem vorhandenen Bereich entsprechen: Vertrieb, Planung, Bauen).");
    await saveMany(newNodes);collapseDefault();
    toast(newNodes.length+" Kacheln importiert");refresh();
  }catch(e){toast("Import fehlgeschlagen: "+e.message)}
}

document.addEventListener("click",async e=>{

  const nd=t.closest(".node");if(nd&&tab==="map"){sel=nd.dataset.id;renderPage();renderPanel();return}

  else if(act==="padd"){const list=Object.values(extra).filter(e=>e.kind==="protocol").sort((a,b)=>b.number-a.number);const last=list[0];
    const nums=(last&&last.next||"").split("\n").map(l=>l.replace(/^\s*[-•*\d.)]+\s*/,"").trim()).filter(Boolean);
    const carried=((last&&last.tasks)||[]).filter(t=>!t.d).map(t=>({t:t.t,d:false,from:t.from||last.number}));
    nums.forEach(t=>{if(!carried.some(c=>c.t===t))carried.push({t,d:false,src:"aus Nächste Schritte / Ziel vom "+fmtD(last.date)})});
    const num=(last?last.number:0)+1;saveExtra({id:"x-prot-"+num+"-"+uid(),kind:"protocol",number:num,date:new Date().toISOString().slice(0,10),tasks:carried,worked:"",notWorked:"",why:"",next:""});renderPage()}
  else if(act==="pdel"){if(confirm("Dieses Protokoll löschen?")){await removeExtra(b.dataset.id);renderPage()}}
  else if(act==="ptoggle"){if(t.closest("input,.pdel"))return;const id=b.dataset.id;protOpen.has(id)?protOpen.delete(id):protOpen.add(id);renderPage()}
  else if(act==="pcarry"){const p=extra[b.dataset.id],tk=p.tasks[i];tk.carry=!tk.carry;const nx=Object.values(extra).filter(e=>e.kind==="protocol"&&e.number>p.number).sort((a,c)=>a.number-c.number)[0];
    if(nx){nx.tasks=nx.tasks.filter(x=>x.t!==tk.t||x.d);if(tk.carry&&!tk.d)nx.tasks.unshift({t:tk.t,d:false,from:tk.from||p.number});saveExtra(nx)}saveExtra(p);renderPage()}
  else if(act==="ptadd"){const e=extra[b.dataset.id];const inp=$("#pt-"+b.dataset.id);if(inp.value.trim()){e.tasks.push({t:inp.value.trim(),d:false});saveExtra(e);renderPage()}}
  else if(act==="ptdel"){const e=extra[b.dataset.id];e.tasks.splice(i,1);saveExtra(e);renderPage()}
  else if(act==="msadd"){const d=$("#msDate").value,t=$("#msTitle").value.trim();if(d&&t){saveExtra({id:"x-ms-"+uid(),kind:"milestone",date:d,title:t,text:$("#msText").value.trim()});renderPage()}else toast("Bitte Datum und Meilenstein eintragen")}
  else if(act==="msdel"){await removeExtra(b.dataset.id);renderPage()}
  else if(act==="ideaadd"){const t=$("#ideaIn").value.trim();if(t){saveExtra({id:"x-idea-"+uid(),kind:"idea",text:t,where:$("#ideaWhere").value.trim()});renderPage()}}
  else if(act==="ideadel"){await removeExtra(b.dataset.id);renderPage()}
  else if(act==="autocsv"){const r=Object.values(nodes).filter(x=>COUNTS(x)&&x.auto&&x.auto!=="nein").map(x=>[x.id,x.auto,pathStr(x.id),x.q.q1||"",x.q.q7||x.q.q4||"",x.q.q9||"",x.deps.map(d=>d.ref||d.text).join(" | "),x.fristen.map(f=>f.art+": "+f.name+" "+f.dauer).join(" | "),x.soll||""]);downloadFile("automationsliste.csv",toCsv(["ID","Tool","Pfad","Auslöser","Wer","Abhängigkeiten/Fristen (Text)","Wartet auf","Fristen","Soll-Änderung"],r),"text/csv")}
  else if(act==="expand"){collapsed.clear();renderPage()}
  else if(act==="collapse"){collapseDefault();renderPage()}
  else if(act==="gaps"){onlyGaps=!onlyGaps;renderPage()}
  else if(act==="close"){sel=null;$("#panel").classList.remove("open");renderPage()}

  else if(act==="csv")exportCsv();
  else if(act==="json")downloadFile("cockpit-"+new Date().toISOString().slice(0,10)+".json",JSON.stringify([...Object.values(nodes),...Object.values(extra)],null,1),"application/json");
  else if(act==="xlsx")$("#fileXlsx").click();
  else if(act==="jsonin")$("#fileJson").click();
  else if(act==="seed")loadSeed();

  else if(act==="addchild"||act==="addsib"){const sib=act==="addsib";const par=sib?n.parent:n.id,lv=sib?n.level:CHILD[n.level];
    const nn=norm({id:uid(),parent:par,level:lv,name:"Neue Kachel",ord:sib?n.ord+0.5:kids(par).length,q:{}});nodes[nn.id]=nn;
    kids(par).forEach((x,k)=>{x.ord=k;save(x)});let c=nodes[par];while(c){collapsed.delete(c.id);c=nodes[c.parent]}
    save(nn);sel=nn.id;refresh();setTimeout(()=>{const i=document.querySelector("#panel [data-name]");if(i){i.focus();i.select()}},60)}
  else if(act==="mapmode"){mapMode={t:"v",v:"h",h:"t"}[mapMode];try{localStorage.setItem("cockpit-mapmode2",mapMode)}catch(e){}renderPage()}
  else if(act==="zin"||act==="zout"||act==="zfit"){const m=$("#map"),w=$("#mapwrap");if(act==="zfit")mapZoom=Math.max(.25,Math.min(1.2,(w.clientWidth-24)/(parseFloat(m.style.width)||1)));else mapZoom=Math.max(.3,Math.min(1.6,mapZoom+(act==="zin"?.15:-.15)));m.style.zoom=mapZoom}
  else if(act==="delnode"){if(!confirm("„"+n.name+"“ mit allen Unterkacheln löschen?"))return;const ids=[];const w=id=>{ids.push(id);kids(id).forEach(k=>w(k.id))};w(n.id);sel=null;await removeIds(ids);refresh()}
  else if(act==="movenode"){const lv=$("#mvLv").value,pid=$("#mvPar").value;if(!pid){toast("Bitte eine Kachel wählen, unter die sie gehört.");return}
    const delta=LORD.indexOf(lv)-LORD.indexOf(n.level),ds=descIds(n.id);
    if(ds.some(i=>LORD.indexOf(nodes[i].level)+delta>4||LORD.indexOf(nodes[i].level)+delta<2)){toast("Geht nicht: Die Unterkacheln hätten dann keine passende Ebene mehr.");return}
    n.level=lv;n.parent=pid;n.ord=kids(pid).length;ds.forEach(i=>{nodes[i].level=LORD[LORD.indexOf(nodes[i].level)+delta]});
    [n.id,...ds].forEach(i=>save(nodes[i]));let c=nodes[pid];while(c){collapsed.delete(c.id);c=nodes[c.parent]}tab="map";refresh();toast("Verschoben nach „"+nodes[pid].name+"“.")}
  else if(act==="delnode"){if(!confirm("„"+n.name+"“ mit allen Unterkacheln löschen?"))return;const ids=[];const w=id=>{ids.push(id);kids(id).forEach(k=>w(k.id))};w(n.id);sel=null;await removeIds(ids);refresh()}
  else if(act==="adddep"){const v=$("#depIn").value.trim();if(!v)return;const hit=Object.values(nodes).find(x=>COUNTS(x)&&pathStr(x.id)===v);n.deps.push({ref:hit?hit.id:null,text:v,art:$("#depArt").value});rp()}
  else if(act==="deldep"){n.deps.splice(i,1);rp()}
  else if(act==="addfr"){n.fristen.push({art:"intern",name:"",dauer:"",bezug:""});rp()}
  else if(act==="delfr"){n.fristen.splice(i,1);rp()}
  else if(act==="addck"){const v=$("#ckIn").value.trim();if(!v)return;n.checklist.push({t:v,n:"",d:false});rp()}
  else if(act==="delck"){n.checklist.splice(i,1);rp()}
});
document.addEventListener("dblclick",e=>{const nd=e.target.closest(".node");if(!nd||tab!=="map")return;const id=nd.dataset.id;if(!kids(id).length)return;collapsed.has(id)?collapsed.delete(id):collapsed.add(id);renderPage()});
let rt=null;const later=()=>{clearTimeout(rt);rt=setTimeout(()=>refresh(true),350)};
document.addEventListener("input",e=>{
  const t=e.target,n=nodes[sel];
  if(t.id==="q"){search=t.value;renderPage();const x=$("#q");x.focus();x.setSelectionRange(search.length,search.length);return}
  if(t.id==="gWer"){gapWer=t.value;renderGaps($("#view"));const x=$("#gWer");x.focus();x.setSelectionRange(gapWer.length,gapWer.length);return}
  if(t.dataset.pf){const e=extra[t.dataset.pid];e[t.dataset.pf]=t.value;saveExtra(e);return}
  if(!n||!$("#panel").contains(t))return;
  if(t.dataset.q){n.q[t.dataset.q]=t.value;save(n);later()}
  else if("src" in t.dataset){n.src=t.value;save(n)}
  else if("ask" in t.dataset){n.ask=t.value;save(n);later()}
  else if("soll" in t.dataset){n.soll=t.value;save(n)}
  else if("name" in t.dataset){n.name=t.value;save(n);later()}
  else if(t.dataset.fr!==undefined){n.fristen[+t.dataset.fr][t.dataset.f]=t.value;save(n)}
});
document.addEventListener("change",e=>{
  const t=e.target,n=nodes[sel];
  if(t.id==="gArea"){gapArea=t.value;renderGaps($("#view"));return}
  if(t.dataset.pdone!==undefined){const e=extra[t.dataset.pid];e.tasks[+t.dataset.pdone].d=t.checked;saveExtra(e);renderPage();return}
  if(t.dataset.pf==="date"){const e=extra[t.dataset.pid];e.date=t.value;saveExtra(e);return}
  if(!n||!$("#panel").contains(t))return;
  if(t.dataset.qc!==undefined){n.qc[+t.dataset.qc]=t.checked;save(n);return}
  if("pilot" in t.dataset){n.pilot=t.checked;save(n);return}
  if("auto" in t.dataset){n.auto=t.value;save(n);return}
  if("status" in t.dataset){n.status=t.value;save(n);refresh()}
  else if("h" in t.dataset){n.h=t.value?+t.value:null;save(n);refresh()}
  else if("a" in t.dataset){n.a=t.value?+t.value:null;save(n);refresh()}
  else if(t.dataset.cd!==undefined){n.checklist[+t.dataset.cd].d=t.checked;save(n);refresh()}
  else if(t.dataset.fr!==undefined){n.fristen[+t.dataset.fr][t.dataset.f]=t.value;save(n)}
});
document.addEventListener("change",e=>{if(e.target.id==="mvLv"&&sel&&nodes[sel])$("#mvPar").innerHTML=mvOpts(e.target.value,sel)});
document.addEventListener("keydown",e=>{const t=e.target;if(e.key==="Enter"&&t.classList&&t.classList.contains("padd")){const id=t.id.slice(3),p=extra[id];if(t.value.trim()){p.tasks.push({t:t.value.trim(),d:false});saveExtra(p);renderPage();setTimeout(()=>{const x=$("#pt-"+id);if(x)x.focus()},0)}}});
$("#fileXlsx").addEventListener("change",e=>{const f=e.target.files[0];if(f)importXlsx(f);e.target.value=""});
$("#fileJson").addEventListener("change",async e=>{
  const f=e.target.files[0];if(!f)return;
  try{const arr=JSON.parse(await f.text());if(!Array.isArray(arr))throw new Error("Falsches Format");await saveMany(arr.map(x=>x.kind?x:norm(x)));refresh();toast(arr.length+" Kacheln importiert")}catch(x){toast("Import fehlgeschlagen: "+x.message)}
  e.target.value="";
});
init();

(()=>{let st=null,moved=false,dn=null,ghost=null,hi=null;
const clr=()=>{if(hi){hi.classList.remove("dt");hi=null}};
document.addEventListener("mousedown",e=>{if(e.button||tab!=="map")return;const w=e.target.closest("#mapwrap");if(!w||e.target.closest(".tg"))return;moved=false;
  const nd=e.target.closest(".node");
  if(nd&&nodes[nd.dataset.id]&&nodes[nd.dataset.id].parent){dn={id:nd.dataset.id,x:e.clientX,y:e.clientY,el:nd};return}
  st={w,x:e.clientX,y:e.clientY,l:w.scrollLeft,t:w.scrollTop}});
document.addEventListener("mousemove",e=>{
  if(dn){if(!moved&&Math.abs(e.clientX-dn.x)+Math.abs(e.clientY-dn.y)<8)return;moved=true;
    if(!ghost){ghost=dn.el.cloneNode(true);ghost.style.cssText="position:fixed;pointer-events:none;opacity:.8;z-index:60;width:226px";document.body.appendChild(ghost);dn.el.style.opacity=".35"}
    ghost.style.left=(e.clientX-100)+"px";ghost.style.top=(e.clientY-18)+"px";
    ghost.style.display="none";const t=document.elementFromPoint(e.clientX,e.clientY);ghost.style.display="";
    const tn=t&&t.closest(".node");clr();if(tn&&tn!==dn.el){hi=tn;tn.classList.add("dt")}
    const w=$("#mapwrap");if(w){const r=w.getBoundingClientRect();if(e.clientY>r.bottom-40)w.scrollTop+=14;if(e.clientY<r.top+40)w.scrollTop-=14}
    return}
  if(!st)return;const dx=e.clientX-st.x,dy=e.clientY-st.y;if(!moved&&Math.abs(dx)+Math.abs(dy)<6)return;moved=true;st.w.classList.add("pan");st.w.scrollLeft=st.l-dx;st.w.scrollTop=st.t-dy});
document.addEventListener("mouseup",e=>{
  if(st){st.w.classList.remove("pan");st=null}
  if(dn){const d=nodes[dn.id];const el=dn.el;el.style.opacity="";if(ghost){ghost.remove();ghost=null}clr();
    if(moved){const t0=document.elementFromPoint(e.clientX,e.clientY);const tn=t0&&t0.closest(".node");
      if(tn&&tn.dataset.id!==d.id){const t=nodes[tn.dataset.id];
        if(descIds(d.id).includes(t.id)){toast("Geht nicht: Die Kachel kann nicht in ihre eigene Unterkachel.")}
        else{let ok;
          if(LORD.indexOf(t.level)<LORD.indexOf(d.level)){ok=moveTo(d,t.id,null,LORD[LORD.indexOf(t.level)+1]);if(ok){collapsed.delete(t.id);toast("Verschoben unter „"+t.name+"“ (jetzt: "+LV[d.level]+").")}}
          else{const r=tn.getBoundingClientRect();const after=e.clientY>r.top+r.height/2;const list=kids(t.parent).filter(x=>x.id!==d.id);let i=list.findIndex(x=>x.id===t.id);if(after)i++;
            ok=moveTo(d,t.parent,i,t.level);if(ok)toast("Verschoben (jetzt: "+LV[d.level]+").")}
          if(ok)refresh();else toast("Geht nicht: Die Unterkacheln hätten dann keine passende Ebene mehr.")}}}
    dn=null}});
document.addEventListener("click",e=>{if(moved){e.stopPropagation();e.preventDefault();moved=false}},true);
})();
try{document.fonts&&document.fonts.ready.then(()=>{if(typeof tab!=="undefined"&&tab==="map")renderPage()})}catch(e){}
</script>
</body>
</html>
