<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cockpit – Ist-Aufnahme</title>
<style>
:root{--brand:#386784;--leaf:#95C11F;--sage:#82B0A9;--light:#EEF4F2;--red:#D9534F;--orange:#E8892B;--grey:#B8B8B8;--text:#25384a;}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;color:var(--text);background:#fff;font-size:14px}
header{display:flex;align-items:center;gap:16px;padding:10px 20px;border-bottom:1px solid #dde6e3;background:#fff;flex-wrap:wrap}
.logo{font-weight:800;font-size:20px;color:var(--brand);text-transform:uppercase}.logo span{color:var(--leaf);text-transform:none}
.sub{color:#6b7c88;font-size:12px}
.badge{padding:3px 10px;border-radius:99px;font-size:12px;font-weight:700;color:#fff}
.b-red{background:var(--red)}.b-or{background:var(--orange)}.b-gr{background:#6ea015}.b-live{background:#6ea015}.b-loc{background:var(--orange)}
.spacer{flex:1}
nav{display:flex;gap:4px;padding:8px 20px;background:var(--light);border-bottom:1px solid #dde6e3;flex-wrap:wrap}
nav button{border:0;background:transparent;padding:8px 14px;border-radius:99px;font-weight:700;color:var(--brand);cursor:pointer;font-size:13px}
nav button.on{background:var(--brand);color:#fff}
main{padding:18px 20px;max-width:100%}
button.btn{background:var(--brand);color:#fff;border:0;padding:8px 14px;border-radius:8px;font-weight:700;cursor:pointer;font-size:13px}
button.btn.ghost{background:#fff;color:var(--brand);border:1px solid var(--brand)}
button.btn.leaf{background:var(--leaf);color:#1c2b00}
button.btn.red{background:var(--red)}
button.btn:disabled{opacity:.5}
.bar{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
input[type=text],input:not([type]),select,textarea{font:inherit;border:1px solid #c5d3cf;border-radius:6px;padding:6px 8px;background:#fff;color:var(--text);width:100%}
textarea{min-height:56px;resize:vertical}
.status{padding:14px 18px;border-radius:12px;font-weight:800;font-size:17px;color:#fff;margin-bottom:16px}
.status.red{background:var(--red)}.status.green{background:#6ea015}
table{border-collapse:collapse;width:100%}
th{background:var(--brand);color:#fff;text-align:left;padding:8px;font-size:12px}
td{padding:7px 8px;border-bottom:1px solid #e6eeeb;vertical-align:top}
tr.link{cursor:pointer}tr.link:hover{background:var(--light)}
.pbar{height:8px;background:#e6eeeb;border-radius:99px;overflow:hidden;min-width:90px}.pbar div{height:100%;background:var(--leaf)}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;vertical-align:middle}
.dot.red{background:var(--red)}.dot.orange{background:var(--orange)}.dot.green{background:var(--leaf)}
.chip{display:inline-block;background:#fbe3e2;color:#a12622;border-radius:99px;padding:1px 8px;font-size:11px;margin:1px 2px 1px 0}
#mapwrap{position:relative;overflow:auto;border:1px solid #dde6e3;border-radius:12px;height:calc(100vh - 215px);background:#fbfdfc}
#map{position:relative}
#map svg{position:absolute;left:0;top:0;pointer-events:none}
.node{position:absolute;width:226px;height:36px;border-radius:10px;border:2.5px solid var(--grey);background:#fff;padding:0 8px;display:flex;align-items:center;gap:6px;cursor:pointer;font-size:12.5px;font-weight:700;color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.node.red{border-color:var(--red)}.node.orange{border-color:var(--orange)}.node.green{border-color:var(--leaf)}
.node.sel{box-shadow:0 0 0 3px rgba(56,103,132,.35)}
.node.company,.node.area{background:var(--brand);color:#fff;border-color:var(--brand)}
.node.area.red{border-color:var(--red);box-shadow:0 0 0 2px var(--red)}
.node .t{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.node .c{font-size:10.5px;font-weight:700;color:#6b7c88;white-space:nowrap}
.node.company .c,.node.area .c{color:#d6e5ee}
.node .tg{width:18px;height:18px;border-radius:50%;background:var(--light);color:var(--brand);text-align:center;line-height:18px;font-size:11px;flex:none}
.node .rd{width:8px;height:8px;border-radius:50%;background:var(--red);flex:none}
#panel{position:fixed;right:0;top:0;bottom:0;width:480px;max-width:100%;background:#fff;border-left:1px solid #c5d3cf;box-shadow:-6px 0 18px rgba(0,0,0,.1);transform:translateX(105%);transition:transform .2s;overflow:auto;padding:16px;z-index:20}
#panel.open{transform:none}
#panel h3,h3{margin:14px 0 6px;color:var(--brand);font-size:13px;text-transform:uppercase;letter-spacing:.06em}
.q{margin-bottom:10px}.q label{display:block;font-weight:700;font-size:12.5px;margin-bottom:3px}
.q.req.empty label{color:var(--red)}.q.req.empty textarea{border-color:var(--red);background:#fff6f5}
.req-tag{font-size:10px;color:#6b7c88;font-weight:400}
.row{display:flex;gap:6px;margin-bottom:6px;align-items:center}
.row>*{flex:1}.row>.sm{flex:none;width:auto}
.crumb{font-size:12px;color:#6b7c88;margin-bottom:6px}
.note{background:#fff8e6;border:1px solid #f1deaa;border-radius:8px;padding:8px;font-size:12.5px}
.ck{display:flex;gap:6px;align-items:flex-start;margin-bottom:3px;font-size:12.5px}.ck input{width:auto;margin-top:3px}
.ck.done span{text-decoration:line-through;color:#8a9aa5}
.x{cursor:pointer;color:var(--red);font-weight:700;flex:none;width:auto}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#25384a;color:#fff;padding:10px 16px;border-radius:8px;display:none;z-index:50;max-width:80%}
.card{border:1px solid #dde6e3;border-radius:12px;padding:14px;margin-bottom:14px}
.muted{color:#6b7c88}
</style>
</head>

  if(k==="q9"&&((n.deps||[]).length||(n.fristen||[]).length)) return true;
  return !!(n.q[k]||"").trim();
}
function missing(n){return (REQ[n.level]||[]).filter(k=>!filled(n,k))}
function ownState(n){ if(missing(n).length) return "red"; return n.status==="confirmed"?"green":"orange"; }
function computeGaps(){
  const out={};
  const visit=id=>{
    const n=nodes[id];let done=0,total=0;const st=[];
    if(COUNTS(n)) st.push(ownState(n));
    for(const k of kids(id)){
      const g=visit(k.id);done+=g.done+(COUNTS(k)&&ownState(k)==="green"?1:0);total+=g.total+(COUNTS(k)?1:0);st.push(g.state);
    }
    if(n.level==="area"&&!kids(id).length) st.push("red");
    const state=st.includes("red")?"red":st.includes("orange")?"orange":"green";
    return out[id]={state,done,total};
  };
  const r=Object.values(nodes).find(n=>!n.parent); if(r) visit(r.id);
  return out;
}

let localTimer=null; const pend=new Map();

function save(n){
  n.upd=Date.now();n.by=CLIENT;

  clearTimeout(pend.get(n.id));

    const r=await sb.from("nodes").upsert({id:n.id,data:n,updated_at:new Date().toISOString()});

  },500));
}

}
async function saveMany(list){
  list.forEach(n=>{n.upd=Date.now();n.by=CLIENT;nodes[n.id]=n});
  if(!LIVE){persistLocal();return}
  for(let i=0;i<list.length;i+=100){
    const r=await sb.from("nodes").upsert(list.slice(i,i+100).map(n=>({id:n.id,data:n,updated_at:new Date().toISOString()})));
    if(r.error){toast("Speichern fehlgeschlagen: "+r.error.message);return}
  }
}
function loadScript(src){return new Promise((ok,no)=>{const s=document.createElement("script");s.src=src;s.onload=ok;s.onerror=()=>no(new Error("Konnte "+src+" nicht laden"));document.head.appendChild(s)})}
function collapseDefault(){Object.values(nodes).forEach(n=>{if((n.level==="main"||n.level==="sub")&&kids(n.id).length) collapsed.add(n.id)})}
async function init(){
  $("#mode").textContent=LIVE?"Gemeinsamer Live-Stand":"Lokaler Modus (nur dieser Browser)";
  $("#mode").className="badge "+(LIVE?"b-live":"b-loc");
  try{
    if(LIVE){
      await loadScript("https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2");
      sb=window.supabase.createClient(CFG.SUPABASE_URL,CFG.SUPABASE_ANON_KEY);
      const r=await sb.from("nodes").select("id,data");
      if(r.error) throw r.error;
      r.data.forEach(x=>nodes[x.id]=norm(x.data));
      sb.channel("nodes-live").on("postgres_changes",{event:"*",schema:"public",table:"nodes"},p=>{
        if(p.eventType==="DELETE"){delete nodes[p.old.id]}
        else{const d=p.new.data;if(d&&d.by===CLIENT)return;nodes[d.id]=norm(d)}
        refresh(true);
      }).subscribe();
    }else{
      const raw=localStorage.getItem("cockpit-ist-v1"); if(raw) Object.values(JSON.parse(raw)).forEach(n=>nodes[n.id]=norm(n));
    }
  }catch(e){toast("Verbindung fehlgeschlagen: "+(e.message||e));}
  if(!Object.keys(nodes).length){ await loadSeed(true); }
  collapseDefault();
  refresh();
}
async function loadSeed(silent){
  const add=SEED.filter(s=>!nodes[s.id]).map(s=>norm(JSON.parse(JSON.stringify(s))));
  await saveMany(add);

  collapseDefault();
  refresh();
}

function refresh(fromRemote){
  GAPS=computeGaps();
  const root=Object.values(nodes).find(n=>!n.parent), g=root?GAPS[root.id]:null;

  $("#nodelist").innerHTML=Object.values(nodes).filter(COUNTS).map(n=>`<option value="${esc(pathStr(n.id))}">`).join("");
  renderTabs();renderView();
  if(sel&&nodes[sel]){ if(!fromRemote||!$("#panel").contains(document.activeElement)) renderPanel(); } else if(sel){sel=null;$("#panel").classList.remove("open")}
}

  const T=[["map","Mindmap"],["ist","Ist-Stand auf einen Blick"],["gaps","Lücken"],["eng","Engpässe"],["dep","Abhängigkeiten und Fristen"],["data","Daten"]];

    <button class="btn ghost" data-act="collapse">Alles zuklappen</button>
    <button class="btn ${onlyGaps?"red":"ghost"}" data-act="gaps">Nur Lücken anzeigen</button>
    <input id="q" placeholder="Suchen …" value="${esc(search)}" style="max-width:240px">
    <span class="muted">Klick = öffnen · Doppelklick = auf-/zuklappen · Rahmen: <span class="dot red"></span> Lücke <span class="dot orange"></span> ausgefüllt, nicht bestätigt <span class="dot green"></span> vollständig</span>
  </div><div id="mapwrap"><div id="map"></div></div>`;
  const pos={};let y=0,maxd=0;
  const q=search.trim().toLowerCase();
  const match=id=>{const n=nodes[id];if(n.name.toLowerCase().includes(q))return true;return kids(id).some(k=>match(k.id))};
  const walk=(id,d)=>{
    maxd=Math.max(maxd,d);
    let ks=kids(id);
    if(onlyGaps) ks=ks.filter(k=>GAPS[k.id].state!=="green");
    if(q) ks=ks.filter(k=>match(k.id));
    const open=ks.length&&(q||!collapsed.has(id));
    if(!open){pos[id]={d,y:y++};return}
    const ys=[];ks.forEach(k=>{walk(k.id,d+1);ys.push(pos[k.id].y)});
    pos[id]={d,y:(ys[0]+ys[ys.length-1])/2};
  };
  const root=Object.values(nodes).find(n=>!n.parent); if(!root){$("#map").textContent="Keine Daten.";return}
  walk(root.id,0);
  const W=(maxd+1)*COLW+40,H=Math.max(y,1)*ROWH+30;
  let svg="",html="";
  for(const id in pos){
    const n=nodes[id],p=pos[id];
    const x=p.d*COLW+12,yy=p.y*ROWH+12;
    for(const k of kids(id)){ if(pos[k.id]&&pos[k.id].d===p.d+1){
      const x1=x+226,y1=yy+18,x2=pos[k.id].d*COLW+12,y2=pos[k.id].y*ROWH+12+18;
      svg+=`<path d="M${x1} ${y1} C ${x1+26} ${y1}, ${x2-26} ${y2}, ${x2} ${y2}" fill="none" stroke="#b9cbc7" stroke-width="1.5"/>`;
    }}
    const g=GAPS[id];const hasK=kids(id).length>0;
    const cnt=hasK&&g.total?`${g.done}/${g.total}`:"";
    const st=(n.level==="company"?"":g.state);
    html+=`<div class="node ${n.level} ${st} ${sel===id?"sel":""}" data-id="${id}" style="left:${x}px;top:${yy}px" title="${esc(n.name)}">
      ${COUNTS(n)&&ownState(n)==="red"?'<span class="rd"></span>':""}
      <span class="t">${esc(n.name)}</span><span class="c">${cnt}</span>
      ${hasK?`<span class="tg" data-tg="${id}">${(q||!collapsed.has(id))?"–":"+"}</span>`:""}</div>`;
  }
  $("#map").style.cssText=`width:${W}px;height:${H}px`;
  $("#map").innerHTML=`<svg width="${W}" height="${H}">${svg}</svg>`+html;
  $("#mapwrap").scrollLeft=scroll[0];$("#mapwrap").scrollTop=scroll[1];
}

function renderIst(v){
  const root=Object.values(nodes).find(n=>!n.parent),g=GAPS[root.id];
  const rows=[];
  for(const a of kids(root.id)){
    const ms=kids(a.id);
    if(!ms.length){rows.push(`<tr><td><b>${esc(a.name)}</b></td><td colspan="5" class="muted">Noch nicht aufgenommen</td><td>${dotc("red")}</td></tr>`);continue}
    ms.forEach((m,i)=>{
      const gi=GAPS[m.id],tot=gi.total+1,done=gi.done+(ownState(m)==="green"?1:0),pc=Math.round(done/tot*100);
      rows.push(`<tr class="link" data-focus="${m.id}"><td>${i?"":"<b>"+esc(a.name)+"</b>"}</td><td>${esc(m.name)}</td><td>${tot}</td><td>${done}</td><td>${tot-done}</td><td><div class="pbar"><div style="width:${pc}%"></div></div>${pc} %</td><td>${dotc(gi.state==="red"||ownState(m)==="red"?"red":gi.state)}</td></tr>`);
    });
  }
  v.innerHTML=`<div class="status ${g.state==="green"?"green":"red"}">${g.state==="green"?"Ist-Stand validiert":"Ist-Stand noch nicht validiert: "+(g.total-g.done)+" von "+g.total+" Kacheln offen"}</div>
  <p class="muted">Eine Kachel ist vollständig, wenn alle Pflichtfragen ausgefüllt sind und der Status „Bestätigt“ ist. Bereiche ohne Hauptprozesse gelten als nicht aufgenommen.</p>
  <table><tr><th>Bereich</th><th>Hauptprozess</th><th>Kacheln</th><th>vollständig</th><th>mit Lücke</th><th>Fortschritt</th><th>Ampel</th></tr>${rows.join("")}</table>`;
}
function gapRows(){
  const out=[];
  Object.values(nodes).filter(COUNTS).forEach(n=>{
    if(ownState(n)==="green")return;
    out.push({id:n.id,path:pathStr(n.id),area:areaOf(n.id),miss:missing(n).map(k=>QS[k][0]),status:(STATUS.find(s=>s[0]===n.status)||[])[1],wer:(n.q.q7||n.q.q4||"").trim()});
  });
  return out.sort((a,b)=>a.path.localeCompare(b.path));
}
let gapArea="",gapWer="";

function select(id,focus){
  sel=id;
  if(focus){let c=nodes[id];while(c&&c.parent){c=nodes[c.parent];collapsed.delete(c.id)}tab="map";search="";onlyGaps=false}
  refresh();
  if(focus){const e=document.querySelector(`.node[data-id="${id}"]`);if(e)e.scrollIntoView({block:"center",inline:"center"})}
}
function downloadFile(name,text,type){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click()}
const csvEsc=v=>'"'+String(v==null?"":v).replace(/"/g,'""')+'"';
function toCsv(head,rows){return "﻿"+[head,...rows].map(r=>r.map(csvEsc).join(";")).join("\n")}
function exportCsv(){
  const head=["ID","Eltern-ID","Ebene","Bereich","Pfad","Name","Q1 Auslöser","Q2 Ergebnis","Q3 Schritte (Unterkacheln)","Q4 Beteiligte","Q5 Unterlagen","Q6 Wo hakt es","Q7 Wer macht / gibt frei","Q8 Ablageort","Q9 Abhängigkeiten und Fristen","Q10 Ausnahmen","Q11 Häufigkeit und Dauer","Q12 Rückfragen","Notiz aus Excel","Checkliste","Wartet auf (IDs)","Wartet auf (Text)","Fristen","Häufigkeit","Auswirkung","Score","Status","Ampel"];
  const order=[];const walk=id=>{order.push(nodes[id]);kids(id).forEach(k=>walk(k.id))};
  const r=Object.values(nodes).find(n=>!n.parent);if(r)walk(r.id);
  const rows=order.filter(n=>n.parent).map(n=>[n.id,n.parent,LV[n.level],areaOf(n.id),pathStr(n.id),n.name,
    n.q.q1,n.q.q2,kids(n.id).map(k=>k.name).join(" | "),n.q.q4,n.q.q5,n.q.q6,n.q.q7,n.q.q8,n.q.q9,n.q.q10,n.q.q11,n.q.q12,n.note,
    n.checklist.map(c=>c.t+(c.n?" → "+c.n:"")).join(" | "),n.deps.filter(d=>d.ref).map(d=>d.ref).join(" | "),n.deps.filter(d=>!d.ref).map(d=>d.text).join(" | "),
    n.fristen.map(f=>f.art+": "+f.name+" "+f.dauer).join(" | "),n.h||"",n.a||"",n.h&&n.a?n.h*n.a:"",(STATUS.find(s=>s[0]===n.status)||[])[1],COUNTS(n)?ownState(n):""]);
  downloadFile("cockpit-ist-aufnahme.csv",toCsv(head,rows),"text/csv");
}
async function importXlsx(file){
  try{
    if(!window.XLSX) await loadScript("https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js");
    const wb=XLSX.read(await file.arrayBuffer(),{type:"array"});
    const pick=e=>{const nm=wb.SheetNames.find(s=>s.trim().endsWith(e));if(!nm)throw new Error("Arbeitsblatt „… "+e+"“ fehlt.");return XLSX.utils.sheet_to_json(wb.Sheets[nm],{header:1,defval:"",range:0})};
    const S=pick("Ist_Struktur"),C=pick("Ist_Checklisten");
    const head=S[3].map(x=>String(x).replace(/\s+/g," ").trim());
    const col=nm=>{const i=head.indexOf(nm);if(i<0)throw new Error("Spalte fehlt in Zeile 4: „"+nm+"“");return i};
    const iID=col("ID"),iP=col("Eltern-ID"),iL=col("Ebene"),iN=col("Name (Hauptprozess / Teilprozess / Schritt)"),iW=col("Verantwortlich"),iH=col("Hinweis aus Excel"),iS=col("Quelle");
    const map={};const newNodes=[];const areaByName=n=>Object.values(nodes).find(x=>x.level==="area"&&x.name===n);
    const cnt={};
    for(const r of S.slice(4)){
      const id=String(r[iID]).trim(),lv=String(r[iL]).trim();if(!id||!lv)continue;
      if(lv==="Bereich"){const a=areaByName(String(r[iN]).trim());if(a)map[id]=a.id;continue}
      const level={Hauptprozess:"main",Teilprozess:"sub",Schritt:"step"}[lv];if(!level)continue;
      const par=map[String(r[iP]).trim()];if(!par)continue;
      const nid=uid();map[id]=nid;if(cnt[par]===undefined)cnt[par]=kids(par).length;
      const w=String(r[iW]).trim();
      newNodes.push(norm({id:nid,parent:par,level,name:String(r[iN]).trim(),ord:cnt[par]++,source:String(r[iS]||""),note:String(r[iH]||"").trim(),q:w?{[level==="step"?"q7":"q4"]:w}:{}}));
    }
    const byId=Object.fromEntries(newNodes.map(n=>[n.id,n]));
    const ch=C[3].map(x=>String(x).trim());
    for(const r of C.slice(4)){
      if(String(r[0]).startsWith("Zusatz"))break;
      const t=byId[map[String(r[ch.indexOf("Kachel-ID")]).trim()]];const txt=String(r[ch.indexOf("Prüfpunkt")]||"").trim();
      if(t&&txt)t.checklist.push({t:txt,n:String(r[ch.indexOf("Hinweis aus Excel")]||"").trim(),d:false});
    }
    if(!newNodes.length)throw new Error("Keine Kacheln gefunden (Bereichsname muss einem vorhandenen Bereich entsprechen: Vertrieb, Planung, Bauen).");
    await saveMany(newNodes);collapseDefault();
    toast(newNodes.length+" Kacheln importiert");refresh();
  }catch(e){toast("Import fehlgeschlagen: "+e.message)}
}

document.addEventListener("click",async e=>{
  const t=e.target;
  const tabb=t.closest("[data-tab]");if(tabb){tab=tabb.dataset.tab;refresh();return}
  const tg=t.closest("[data-tg]");if(tg){const id=tg.dataset.tg;collapsed.has(id)?collapsed.delete(id):collapsed.add(id);renderView();return}
  const nd=t.closest(".node");if(nd&&tab==="map"){sel=nd.dataset.id;renderView();renderPanel();return}
  const fo=t.closest("[data-focus]");if(fo){select(fo.dataset.focus,true);return}
  const b=t.closest("[data-act]");if(!b)return;
  const act=b.dataset.act,n=nodes[sel],i=+b.dataset.i;
  const rp=()=>{save(n);refresh()};
  if(act==="expand"){collapsed.clear();renderView()}
  else if(act==="collapse"){collapseDefault();renderView()}
  else if(act==="gaps"){onlyGaps=!onlyGaps;renderView()}
  else if(act==="close"){sel=null;$("#panel").classList.remove("open");renderView()}
  else if(act==="gapcsv"){const r=gapRows();downloadFile("luecken.csv",toCsv(["Pfad","Bereich","Fehlende Pflichtfragen","Status","Wer"],r.map(x=>[x.path,x.area,x.miss.join(", "),x.status,x.wer])),"text/csv")}
  else if(act==="csv")exportCsv();
  else if(act==="json")downloadFile("cockpit-"+new Date().toISOString().slice(0,10)+".json",JSON.stringify(Object.values(nodes),null,1),"application/json");
  else if(act==="xlsx")$("#fileXlsx").click();
  else if(act==="jsonin")$("#fileJson").click();
  else if(act==="seed")loadSeed();
  else if(act==="wipe"){if(confirm("Wirklich ALLE Kacheln löschen?")&&confirm("Letzte Warnung: das kann nicht rückgängig gemacht werden.")){await removeIds(Object.keys(nodes));sel=null;refresh()}}
  else if(act==="addchild"){const c=CHILD[n.level];const nn=norm({id:uid(),parent:n.id,level:c,name:"Neue Kachel",ord:kids(n.id).length,q:{}});nodes[nn.id]=nn;collapsed.delete(n.id);save(nn);sel=nn.id;refresh()}
  else if(act==="delnode"){if(!confirm("„"+n.name+"“ mit allen Unterkacheln löschen?"))return;const ids=[];const w=id=>{ids.push(id);kids(id).forEach(k=>w(k.id))};w(n.id);sel=null;await removeIds(ids);refresh()}
  else if(act==="adddep"){const v=$("#depIn").value.trim();if(!v)return;const hit=Object.values(nodes).find(x=>COUNTS(x)&&pathStr(x.id)===v);n.deps.push({ref:hit?hit.id:null,text:v,art:$("#depArt").value});rp()}
  else if(act==="deldep"){n.deps.splice(i,1);rp()}
  else if(act==="addfr"){n.fristen.push({art:"intern",name:"",dauer:"",bezug:""});rp()}
  else if(act==="delfr"){n.fristen.splice(i,1);rp()}
  else if(act==="addck"){const v=$("#ckIn").value.trim();if(!v)return;n.checklist.push({t:v,n:"",d:false});rp()}
  else if(act==="delck"){n.checklist.splice(i,1);rp()}
});
document.addEventListener("dblclick",e=>{const nd=e.target.closest(".node");if(!nd||tab!=="map")return;const id=nd.dataset.id;if(!kids(id).length)return;collapsed.has(id)?collapsed.delete(id):collapsed.add(id);renderView()});
let rt=null;const later=()=>{clearTimeout(rt);rt=setTimeout(()=>refresh(true),350)};
document.addEventListener("input",e=>{
  const t=e.target,n=nodes[sel];
  if(t.id==="q"){search=t.value;renderView();const x=$("#q");x.focus();x.setSelectionRange(search.length,search.length);return}
  if(t.id==="gWer"){gapWer=t.value;renderGaps($("#view"));const x=$("#gWer");x.focus();x.setSelectionRange(gapWer.length,gapWer.length);return}
  if(!n||!$("#panel").contains(t))return;
  if(t.dataset.q){n.q[t.dataset.q]=t.value;save(n);later()}
  else if("name" in t.dataset){n.name=t.value;save(n);later()}
  else if(t.dataset.fr!==undefined){n.fristen[+t.dataset.fr][t.dataset.f]=t.value;save(n)}
});
document.addEventListener("change",e=>{
  const t=e.target,n=nodes[sel];
  if(t.id==="gArea"){gapArea=t.value;renderGaps($("#view"));return}
  if(!n||!$("#panel").contains(t))return;
  if("status" in t.dataset){n.status=t.value;save(n);refresh()}
  else if("h" in t.dataset){n.h=t.value?+t.value:null;save(n);refresh()}
  else if("a" in t.dataset){n.a=t.value?+t.value:null;save(n);refresh()}
  else if(t.dataset.cd!==undefined){n.checklist[+t.dataset.cd].d=t.checked;save(n);refresh()}
  else if(t.dataset.fr!==undefined){n.fristen[+t.dataset.fr][t.dataset.f]=t.value;save(n)}
});
$("#fileXlsx").addEventListener("change",e=>{const f=e.target.files[0];if(f)importXlsx(f);e.target.value=""});
$("#fileJson").addEventListener("change",async e=>{
  const f=e.target.files[0];if(!f)return;
  try{const arr=JSON.parse(await f.text());if(!Array.isArray(arr))throw new Error("Falsches Format");await saveMany(arr.map(norm));refresh();toast(arr.length+" Kacheln importiert")}catch(x){toast("Import fehlgeschlagen: "+x.message)}
  e.target.value="";
});
init();
</script>
</body>
</html>
